<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Animation</title>
    <link rel="stylesheet" href="./output.css">
</head>

<body class="p-10">

    <div class="flex gap-10 items-center">

        <div class="size-20 bg-blue-500 animate-spin"></div>

        <div class="size-20 bg-red-500 animate-ping"></div>

        <div class="size-20 bg-green-500 animate-pulse"></div>

        <div class="size-20 bg-yellow-500 animate-bounce"></div>

    </div>

</body>
</html>
