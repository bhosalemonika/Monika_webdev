<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Width</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body class="p-5">

    <h1 class="text-3xl font-bold mb-5">Tailwind CSS Width</h1>

    <div class="bg-green-700 w-1/6 text-white p-2 mb-3">w-1/6</div>
    <div class="bg-green-700 w-1/2 text-white p-2 mb-3">w-1/2</div>
    <div class="bg-green-700 w-1/3 text-white p-2 mb-3">w-1/3</div>
    <div class="bg-green-700 w-2/3 text-white p-2 mb-3">w-2/3</div>
    <div class="bg-green-700 w-full text-white p-2 mb-3">w-full</div>

    <div class="bg-yellow-300 w-xs p-2 mb-3">w-xs</div>
    <div class="bg-yellow-300 w-sm p-2 mb-3">w-sm</div>
    <div class="bg-yellow-300 w-md p-2 mb-3">w-md</div>
    <div class="bg-yellow-300 w-lg p-2 mb-3">w-lg</div>
    <div class="bg-yellow-300 w-xl p-2 mb-3">w-xl</div>
    <div class="bg-yellow-300 w-2xl p-2 mb-3">w-2xl</div>
    <div class="bg-yellow-300 w-3xl p-2 mb-3">w-3xl</div>
    <div class="bg-yellow-300 w-4xl p-2 mb-3">w-4xl</div>
    <div class="bg-yellow-300 w-5xl p-2 mb-3">w-5xl</div>
    <div class="bg-yellow-300 w-6xl p-2 mb-3">w-6xl</div>
    <div class="bg-yellow-300 w-7xl p-2 mb-3">w-7xl</div>
    <div class="bg-yellow-300 w-8xl p-2 mb-3">w-8xl</div>

    <div class="bg-blue-500 w-20 text-white p-2 mb-3">w-20</div>
    <div class="bg-blue-500 w-40 text-white p-2 mb-3">w-40</div>
    <div class="bg-blue-500 w-60 text-white p-2 mb-3">w-60</div>
    <div class="bg-blue-500 w-80 text-white p-2 mb-3">w-80</div>
    <div class="bg-blue-500 w-96 text-white p-2 mb-3">w-96</div>

    <div class="bg-red-500 w-auto text-white p-2 mb-3">w-auto</div>
    <div class="bg-red-500 w-screen text-white p-2 mb-3">w-screen</div>
    <div class="bg-red-500 w-min text-white p-2 mb-3">w-min</div>
    <div class="bg-red-500 w-max text-white p-2 mb-3">w-max</div>
    <div class="bg-red-500 w-fit text-white p-2 mb-3">w-fit</div>

</body>
</html>
