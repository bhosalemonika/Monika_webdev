<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .flex-container {
      display: flex;
      flex-direction: row;        
      flex-wrap: wrap;            
      justify-content: space-between; 
      align-items: center;     
      align-content: center;    
      
      height: 400px;
      background-color: #333;
      padding: 10px;
    }

    .flex-item {
      width: 120px;
      height: 100px;
      background-color: coral;
      border: 2px solid white;
      color: white;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .item-1 {
      order: 2;        
      flex-grow: 2;   
    }

    .item-2 {
      order: 1;
      flex-shrink: 3;  
      align-self: flex-end;
    }

    .item-3 {
      flex-basis: 200px;
    }
  </style>
</head>
<body>
  <div class="flex-container">
    <div class="flex-item item-1">Item 1</div>
    <div class="flex-item item-2">Item 2</div>
    <div class="flex-item item-3">Item 3</div>
    <div class="flex-item">Item 4</div>
  </div>
</body>
</html>
