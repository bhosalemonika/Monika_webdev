<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Model</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .box-demo {
      width: 350px;
      height: 200px;
      background-color: aquamarine;

      border: 3px solid black;
      border-radius: 10px;

      border-top: 5px solid darkred;

      padding: 20px 40px;

      margin: 30px auto;
    }
  </style>
</head>
<body>
  <div class="box-demo">
    <h2>Box Model Demonstration</h2>
    <p>Content + Padding + Border + Margin</p>
  </div>
</body>
</html>
