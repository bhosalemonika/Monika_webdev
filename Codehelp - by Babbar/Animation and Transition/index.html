<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animations & Transitions</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .container {
      padding: 50px;
    }

    .btn-transition {
      padding: 15px 30px;
      background-color: #2ecc71;
      color: white;
      border: none;
      font-size: 18px;
      cursor: pointer;
      border-radius: 6px;

      transition: all 0.4s ease-in-out 0s;
    }

    .btn-transition:hover {
      background-color: #e74c3c;
      transform: scale(1.1);
    }

    .anim-box {
      width: 100px;
      height: 100px;
      background-color: royalblue;
      margin-top: 50px;
      border-radius: 10px;

      animation: moveAndRotate 4s ease-in-out 1s infinite alternate running;
    }

    @keyframes moveAndRotate {
      0% {
        transform: translateX(0) rotate(0deg);
        background-color: royalblue;
      }
      50% {
        background-color: purple;
        border-radius: 50%;
      }
      100% {
        transform: translateX(300px) rotate(360deg);
        background-color: crimson;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="btn-transition">Hover Transition</button>
    <div class="anim-box"></div>
  </div>
</body>
</html>
