<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .container {
      padding: 20px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      justify-content: center;
    }

    .grid-item {
      background-color: #16a085;
      color: white;
      padding: 30px;
      font-size: 20px;
      border-radius: 8px;
      text-align: center;
    }

    .layout-grid {
      display: grid;
      grid-template-areas:
        "header header header"
        "sidebar main main"
        "footer footer footer";
      grid-template-columns: 200px 1fr 1fr;
      gap: 10px;
      margin-top: 40px;
    }

    .header  { grid-area: header; background: #2c3e50; color: white; padding: 15px; }
    .sidebar { grid-area: sidebar; background: #95a5a6; color: white; padding: 15px; }
    .main    { grid-area: main; background: #ecf0f1; padding: 15px; }
    .footer  { grid-area: footer; background: #34495e; color: white; padding: 15px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Auto-Responsive Card Grid</h2>
    <div class="grid-container">
      <div class="grid-item">Card 1</div>
      <div class="grid-item">Card 2</div>
      <div class="grid-item">Card 3</div>
      <div class="grid-item">Card 4</div>
    </div>

    <div class="layout-grid">
      <div class="header">Header</div>
      <div class="sidebar">Sidebar</div>
      <div class="main">Main Content Area</div>
      <div class="footer">Footer</div>
    </div>
  </div>

</body>
</html>
