<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fonts & Colors</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Roboto', sans-serif; 
    }

    .font-demo {
      font-style: italic;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.6;
    }

    #para1 {
      background-color: yellow;
      color: brown;
    }

    #para2 {
      background-color: rgba(100, 109, 192, 0.8);
      color: white;
    }

    .para-hex {
      background-color: #67bb59;
      color: #ffffff;
    }

    #para4 {
      background-color: hsl(120, 100%, 50%);
      color: black;
    }
  </style>
</head>
<body>
  <p id="para1" class="font-demo">Paragraph 1 - Named Colors & Custom Fonts</p>
  <p id="para2">Paragraph 2 - RGBA Color Model</p>
  <p class="para-hex">Paragraph 3 - HEX Color Model</p>
  <p id="para4">Paragraph 4 - HSL Color Model</p>
</body>
</html>
