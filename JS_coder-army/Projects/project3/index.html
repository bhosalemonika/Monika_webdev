

<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="parent">

        <form>
            <input type="text" id="partner1" placeholder="First Partner Name" required>
            <div>

            </div>
            <input type="text" id="partner2" placeholder="Second Partner Name" required>
            <button type="submit" id="submit">Submit</button>

        </form>

        <h2 id="result">Love Percentage is:</h2>

    </div>

    <script src="first.js"></script>

</body>
</html>
