<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cont">
        <form id="astro">
            <h1>Astrology Insites</h1>
            <label>First Name</label>
            <input type="text" id="name" placeholder="Enter Your Name">
            <label>Surname</label>
            <input type="text" id="surname" placeholder="Enter Your Surname">
            <label>Date of Birth (day)</label>
            <input type="number" id="day" placeholder="Enter Date">
            <label>Month</label>
            <input type="number" id="month" placeholder="Enter Month">
            <label>Year</label>
            <input type="number" id="year" placeholder="Enter year">
            
            <button type="submit" id="bt">Get Insites</button>

            <div id="result"></div>
        
        </form>
    </div>
    <script src="first.js"></script>
</body>
</html>
