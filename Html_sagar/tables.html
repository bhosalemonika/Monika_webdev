<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Complete HTML Table Example</title>
</head>
<body>

    <h2>Product Price List</h2>

    <table border="1" cellpadding="8" cellspacing="0">
        <caption>Fruit Store Price & Stock Summary</caption>
        <thead>
            <tr>
                <th>Category</th>
                <th>Item Name</th>
                <th>Price (INR)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Fruits</td>
                <td>Apple</td>
                <td>200</td>
            </tr>
            <tr>
                <td>Banana</td>
                <td>100</td>
            </tr>
            <tr>
                <td>Citrus</td>
                <td>Orange</td>
                <td>180</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2"><strong>Total Average Price</strong></td>
                <td><strong>160 INR</strong></td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
