<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>HTML Form</title>
</head>
<body>

    <h2>User Registration Form</h2>

    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <p>
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
            </p>
            <p>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </p>

            <p>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </p>
            <p>
                <label for="age">Age:</label><br>
                <input type="number" id="age" name="age" min="18" max="100" placeholder="18">
            </p>
            <p>
                <label for="dob">Date of Birth:</label><br>
                <input type="date" id="dob" name="dob">
            </p>
            <p>
                <label for="favcolor">Favorite Color:</label><br>
                <input type="color" id="favcolor" name="favcolor" value="#0000ff">
            </p>
            <p>
                <label for="resume">Upload Resume (PDF):</label><br>
                <input type="file" id="resume" name="resume" accept=".pdf,.doc">
            </p>
            <p>
                <label for="experience">Experience Level (0 to 100):</label><br>
                <input type="range" id="experience" name="experience" min="0" max="100" value="50">
            </p>
        </fieldset>

        <br>



        <fieldset>
            <legend>Preferences & Selections</legend>

            <p>Gender:</p>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>

            <p>Hobbies:</p>
            <input type="checkbox" id="coding" name="hobby" value="coding">
            <label for="coding">Coding</label>
            <input type="checkbox" id="reading" name="hobby" value="reading">
            <label for="reading">Reading</label>
            <input type="checkbox" id="gaming" name="hobby" value="gaming">
            <label for="gaming">Gaming</label>
        </fieldset>

        <br>

        <button type="submit">Submit Form</button>
        <button type="reset">Reset Form</button>

    </form>

</body>
</html>
